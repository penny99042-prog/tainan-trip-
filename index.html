<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試成功！</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0fdf4; /* 淡綠色背景 */
            color: #166534;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {

        h1 { margin-bottom: 10px; }
        p { font-size: 1.2rem; }
        .success-icon { font-size: 4rem; margin-bottom: 20px; display: block; }

</head>
<body>

    <div class="card">
        <span class="success-icon">🎉</span>
        <h1>網頁發布成功！</h1>
        <p>如果你看到這個畫面，<br>代表你的 GitHub 網址已經生效了。</p>
        <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">
        <p style="color: #666; font-size: 0.9rem;">現在把這個網址傳給同學測試吧！</p>
    </div>

</html>
